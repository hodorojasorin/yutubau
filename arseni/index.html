<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF700">
<title>ARSENI · Aplicația</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<style>
/*
VOICE: energetic, direct, Gen Z — like a creator's onboarding, not a form.
IDEA: a collectible creator card / an instant brief, printed by the ARSENI star.
PICTURE: the spinning ARSENI star; at the end, a tilting holo card you can show off.
COLOUR and TYPE: #FFF700 yellow, #121212 black, #FAF7F0 warm white; Unbounded Black + Inter.
LAYOUT: one thumb-sized column, one question per screen, big tap targets, sticky Next.
*/
:root{--y:#FFF700;--y2:#C7BF00;--k:#121212;--k2:#1E1E1E;--k3:#2A2A2A;--w:#FAF7F0;--g:#A8A49C;--g2:#6E6A63;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--k);color:var(--w);font:16px/1.5 Inter,system-ui,-apple-system,sans-serif;overflow-x:clip}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--y);outline-offset:3px}
.d{font-family:Unbounded,Inter,sans-serif;font-weight:900;letter-spacing:-.01em;line-height:1.05;text-wrap:balance}
#app{min-height:100dvh;max-width:520px;margin:0 auto;position:relative;overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(var(--sat) + 18px) 20px calc(var(--sab) + 20px);animation:in .45s cubic-bezier(.2,.9,.2,1) both;overflow-y:auto}
.scr.out{animation:out .25s ease both;pointer-events:none}
@keyframes in{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateX(-24px)}}
.back .scr{animation-name:inb}@keyframes inb{from{opacity:0;transform:translateX(-28px)}}
/* home */
.home{background:var(--y);color:var(--k);padding-bottom:calc(var(--sab) + 16px)}
.home .top{display:flex;justify-content:space-between;align-items:center}
.wm{height:22px;fill:var(--k)}
.pill{font:600 13px Inter;padding:7px 12px;border-radius:99px;background:var(--k);color:var(--y)}
.hero{flex:1;display:grid;place-items:center;min-height:220px;position:relative}
.star{width:min(52vw,250px);fill:var(--k);animation:spin 6s cubic-bezier(.7,0,.2,1) infinite;filter:drop-shadow(0 14px 0 rgba(0,0,0,.08))}
@keyframes spin{0%,18%{transform:rotate(0) scale(1)}30%{transform:rotate(-100deg) scale(.9)}40%,58%{transform:rotate(-72deg) scale(1)}70%{transform:rotate(-170deg) scale(.9)}80%,100%{transform:rotate(-144deg) scale(1)}}
.marq{overflow:hidden;margin:0 -20px;border-block:2px solid var(--k);padding:8px 0;white-space:nowrap}
.marq div{display:inline-block;animation:mq 16s linear infinite;font:900 15px Unbounded,sans-serif}
@keyframes mq{to{transform:translateX(-50%)}}
.home h1{font-size:clamp(34px,10vw,46px);margin:18px 0 6px}
.home p.sub{margin:0 0 18px;font-weight:500}
.roles{display:grid;gap:12px}
.role{display:flex;align-items:center;gap:14px;text-align:left;padding:18px;border-radius:24px;min-height:84px;transition:transform .15s}
.role:active{transform:scale(.97)}
.role.c{background:var(--k);color:var(--w)}.role.b{background:var(--w);color:var(--k)}
.role .ic{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center}
.role.c .ic{background:var(--y)}.role.b .ic{background:var(--k)}
.role b{display:block;font:900 20px Unbounded,sans-serif}
.role b+span{font-size:14px;opacity:.75}
.role .ar{margin-left:auto;font-size:24px}
.fine{font-size:13px;color:var(--g2);text-align:center;margin-top:14px}
/* flow */
.bar{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.bk{width:44px;height:44px;border-radius:14px;background:var(--k3);display:grid;place-items:center;font-size:20px;flex:none}
.prog{flex:1;height:6px;border-radius:9px;background:var(--k3);overflow:hidden}
.prog i{display:block;height:100%;background:var(--y);border-radius:9px;transition:width .5s cubic-bezier(.2,.9,.2,1)}
.cnt{font:600 13px Inter;color:var(--g);flex:none}
.q{font-size:clamp(28px,8vw,36px);margin:4px 0 8px}
.hint{color:var(--g);margin:0 0 20px}
.field{display:flex;align-items:center;background:var(--k2);border:2px solid var(--k3);border-radius:18px;padding:0 16px;min-height:60px;margin-bottom:12px;transition:border-color .2s}
.field:focus-within{border-color:var(--y)}
.field span{color:var(--y);font:900 20px Unbounded,sans-serif;margin-right:4px}
.field input{flex:1;border:0;background:none;outline:0;font-size:18px;font-weight:600;height:56px}
.lbl{font:600 13px Inter;color:var(--g);margin:14px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:10px 16px;border-radius:99px;background:var(--k2);border:2px solid var(--k3);font-weight:600;font-size:15px;transition:all .15s}
.chip.on{background:var(--y);border-color:var(--y);color:var(--k)}
.chip:active{transform:scale(.95)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;padding:16px;border-radius:20px;background:var(--k2);border:2px solid var(--k3);min-height:72px;transition:all .15s}
.opt .ic{flex:none;width:44px;height:44px;border-radius:14px;background:var(--k3);display:grid;place-items:center;font:900 18px Unbounded,sans-serif;color:var(--y)}
.opt b{display:block;font-size:16px}.opt small{color:var(--g);font-size:14px}
.opt .tk{margin-left:auto;flex:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--g2);display:grid;place-items:center;font-size:15px;color:transparent}
.opt.on{border-color:var(--y)}.opt.on .tk{background:var(--y);border-color:var(--y);color:var(--k)}
.opt.on .ic{background:var(--y);color:var(--k)}
.big{font-size:clamp(56px,18vw,84px);color:var(--y);margin:18px 0 0;text-align:center;white-space:nowrap}
#bv{font-size:clamp(34px,11vw,56px)}
.big small{display:block;font:600 15px Inter;color:var(--g);margin-top:8px;letter-spacing:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:none;margin:22px 0 6px}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:9px;background:linear-gradient(90deg,var(--y) var(--p,30%),var(--k3) var(--p,30%))}
input[type=range]::-moz-range-track{height:10px;border-radius:9px;background:var(--k3)}
input[type=range]::-moz-range-progress{height:10px;border-radius:9px;background:var(--y)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:var(--y);border:5px solid var(--k);margin-top:-12px;box-shadow:0 0 0 2px var(--y)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--y);border:5px solid var(--k)}
.ticks{display:flex;justify-content:space-between;color:var(--g);font-size:13px}
.tier{margin-top:18px;padding:16px;border-radius:18px;background:var(--k2);display:flex;gap:12px;align-items:center}
.tier b{color:var(--y)}
.grow{flex:1}
.next{position:sticky;bottom:0;margin-top:20px;padding-top:12px;background:linear-gradient(transparent,var(--k) 30%)}
.go{width:100%;min-height:60px;border-radius:20px;background:var(--y);color:var(--k);font:900 17px Unbounded,sans-serif;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s,opacity .2s}
.go:disabled{opacity:.35}
.go:active:not(:disabled){transform:scale(.97)}
.ghost{width:100%;min-height:52px;border-radius:18px;background:var(--k2);font-weight:600;margin-top:10px}
/* brand theme */
.brand{background:var(--w);color:var(--k)}
.brand .bk,.brand .prog{background:#E4DFD3}.brand .cnt,.brand .hint,.brand .lbl,.brand .opt small,.brand .ticks{color:var(--g2)}
.brand .prog i,.brand .go{background:var(--k);color:var(--y)}
.brand .field,.brand .chip,.brand .opt,.brand .tier{background:#fff;border-color:#E4DFD3}
.brand .field:focus-within{border-color:var(--k)}.brand .field span{color:var(--k)}
.brand .chip.on{background:var(--k);border-color:var(--k);color:var(--y)}
.brand .opt .ic{background:#F1ECE0;color:var(--k)}.brand .opt.on{border-color:var(--k)}.brand .opt.on .ic,.brand .opt.on .tk{background:var(--k);color:var(--y);border-color:var(--k)}
.brand .big{color:var(--k)}.brand .tier b{color:var(--k)}
.brand .next{background:linear-gradient(transparent,var(--w) 30%)}.brand .ghost{background:#E4DFD3}
.brand input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--k) var(--p,30%),#E4DFD3 var(--p,30%))}
.brand input[type=range]::-webkit-slider-thumb{background:var(--y);border-color:var(--k);box-shadow:0 0 0 2px var(--k)}
.brand input[type=range]::-moz-range-progress{background:var(--k)}
/* result */
.res{text-align:center}
.res .q{margin-top:6px}
.stage{perspective:900px;margin:10px auto 18px;width:min(100%,340px)}
.card{position:relative;aspect-ratio:5/7;border-radius:26px;background:var(--y);color:var(--k);padding:22px;text-align:left;transform-style:preserve-3d;transition:transform .12s ease-out;box-shadow:0 30px 60px -20px rgba(255,247,0,.35);overflow:hidden;animation:pop .7s cubic-bezier(.2,1.4,.3,1) both}
@keyframes pop{from{transform:scale(.6) rotate(-8deg);opacity:0}}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);transform:translateX(var(--sh,-60%));transition:transform .12s;pointer-events:none;mix-blend-mode:soft-light}
.card .cs{position:absolute;right:-48px;bottom:-40px;width:230px;fill:var(--k);opacity:.95;animation:spin 6s cubic-bezier(.7,0,.2,1) infinite}
.card .id{display:flex;justify-content:space-between;font:700 12px Inter}
.card h3{font-size:26px;margin:26px 0 4px;word-break:break-word}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.card .tags span{font:600 12px Inter;padding:5px 9px;border-radius:99px;background:var(--k);color:var(--y)}
.card .aud{font-size:14px;max-width:72%}
.card .aud b{display:block;font:900 15px Unbounded,sans-serif;margin-bottom:2px}
.card .stamp{display:inline-block;margin-top:14px;font:900 13px Unbounded,sans-serif;padding:6px 10px;border:3px solid var(--k);border-radius:10px;transform:rotate(-4deg);text-transform:uppercase}
.card h3{margin-top:12px!important}
.card .score{position:absolute;left:22px;bottom:20px;font:900 40px Unbounded,sans-serif;line-height:1}
.card .score small{display:block;font:600 12px Inter}
.steps{text-align:left;display:grid;gap:10px;margin:6px 0 8px}
.steps div{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--k2)}
.steps i{flex:none;width:34px;height:34px;border-radius:11px;background:var(--y);color:var(--k);display:grid;place-items:center;font:900 14px Unbounded,sans-serif;font-style:normal}
.brief{text-align:left;background:#fff;border:2px solid #E4DFD3;border-radius:24px;padding:20px;animation:pop .7s cubic-bezier(.2,1.4,.3,1) both}
.brief .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brief .row{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:10px 0;border-top:1px solid #EEE8DC}
.brief .row b{font:900 13px Unbounded,sans-serif}
.est{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.est div{background:var(--k);color:var(--y);border-radius:16px;padding:12px 8px;text-align:center}
.est b{display:block;font:900 clamp(16px,5vw,20px) Unbounded,sans-serif;white-space:nowrap}
.est small{font-size:12px;color:var(--w)}
.match{display:grid;gap:8px;text-align:left}
.cr{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:#fff;border:2px solid #E4DFD3}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:900 15px Unbounded,sans-serif;color:var(--k)}
.cr .pc{margin-left:auto;font:900 16px Unbounded,sans-serif}
.cr small{display:block;color:var(--g2);font-size:13px}
.note{font-size:13px;color:var(--g);margin:8px 0 0}
.brand .note{color:var(--g2)}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 24px);transform:translate(-50%,120px);background:var(--y);color:var(--k);font-weight:700;padding:12px 18px;border-radius:99px;transition:transform .3s;z-index:9}
.toast.on{transform:translate(-50%,0)}
.cf{position:fixed;top:-40px;width:22px;fill:var(--y);z-index:8;animation:fall var(--t) cubic-bezier(.3,.1,.6,1) forwards;pointer-events:none}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(var(--r))}}
textarea.cp{width:100%;min-height:140px;margin-top:10px;border-radius:14px;padding:12px;font:14px/1.5 Inter;background:#fff;color:var(--k);border:2px solid #E4DFD3}
/* ---------- echipa ARSENI ---------- */
.ico{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.role.t{background:transparent;color:var(--k);border:2px solid var(--k);min-height:72px;padding:14px 18px}
.role.t .ic{background:var(--k);color:var(--y)}.role.t b{font-size:18px}
.mine{display:flex;gap:10px;align-items:center;background:rgba(18,18,18,.08);border-radius:16px;padding:10px 14px;margin:0 0 12px;font-size:14px;line-height:1.45}
body.wide #app{max-width:none}
.tgate .star{fill:var(--y)}
.team{padding:0!important;background:var(--k)}
.team .side{display:none}
.ttop{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 12px) 16px 12px;background:rgba(18,18,18,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid #222}
.ttop .tt{display:flex;align-items:center;gap:10px;margin-right:auto}.ttop .tt b{font-size:19px}
.tbell,.tme{position:relative;width:44px;height:44px;border-radius:14px;background:var(--k2);display:grid;place-items:center;flex:none}
.tme{background:var(--y);color:var(--k);font:900 16px Unbounded,sans-serif;border-radius:50%}
.tbell i{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:99px;background:var(--y);color:var(--k);font:800 11px/20px Inter;font-style:normal;padding:0 5px;text-align:center}
.tmain{flex:1;padding:18px 16px 28px}
.tmain.fx{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.tbar{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 4px calc(var(--sab) + 6px);background:rgba(18,18,18,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid #222}
.tn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;font:600 11px Inter;color:var(--g);border-radius:14px;width:100%}
.tn.on{color:var(--y)}
.tn .nb{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:99px;background:var(--y);color:var(--k);font:800 10px/18px Inter;font-style:normal;padding:0 5px;text-align:center}
.vt{font-size:clamp(30px,8vw,42px);margin:2px 0 16px}
.eyebrow{font:600 13px Inter;color:var(--g);margin:0}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.vrow .vt{margin-bottom:16px}
.add{min-height:44px;padding:0 16px;border-radius:14px;background:var(--y);color:var(--k);font:800 14px Inter;flex:none;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;padding:16px;border-radius:22px;background:var(--k2);border:1px solid #262626;min-height:112px;transition:transform .15s}
button.kpi:active{transform:scale(.97)}
.kpi .kv{display:flex;align-items:baseline;gap:6px}
.kpi b{font-size:clamp(28px,8.5vw,36px)}
.kpi em{font:700 12px Inter;font-style:normal;color:var(--g)}
.kpi .kl{font-size:13px;font-weight:600;color:var(--g);line-height:1.3}
.kpi.y{background:var(--y);color:var(--k);border-color:var(--y)}.kpi.y .kl,.kpi.y em{color:#5d5900}
.kpi.red b{color:#FF8E8E}
.card2{background:var(--k2);border:1px solid #262626;border-radius:22px;padding:18px;margin-bottom:14px}
.card2 h3{font:800 15px Inter;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.bd{display:inline-block;font:700 12px/1 Inter;padding:6px 9px;border-radius:99px;white-space:nowrap}
.bd.y{background:var(--y);color:var(--k)}.bd.w{background:#38361a;color:var(--y)}.bd.g{background:#2c2c2c;color:#cfcac0}.bd.ok{background:#1d3523;color:#8FE3A0}.bd.no{background:#3b1d1d;color:#FF9A9A}
.todo{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 0;border-top:1px solid #2b2b2b;font-size:15px;line-height:1.35}
.card2 h3+.todo{border-top:0}
.todo .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--y)}
.todo.u .dot{background:#FF6B6B;box-shadow:0 0 0 4px rgba(255,107,107,.18)}
.todo .ar{margin-left:auto;color:var(--g);flex:none}
.empty{display:flex;align-items:center;gap:10px;color:var(--g);margin:6px 0;grid-column:1/-1}
.fun{display:grid;gap:12px}
.fun .lab{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.bt{height:12px;border-radius:9px;background:#2c2c2c;overflow:hidden}
.bt i{display:block;height:100%;border-radius:9px;background:var(--y);transform-origin:left;animation:grx .9s cubic-bezier(.2,.9,.2,1) both}
@keyframes grx{from{transform:scaleX(0)}}
.avs{display:flex;flex-wrap:wrap;gap:6px}
.avs .av{width:42px;height:42px;font-size:14px}
.av.s,.avs.s .av{width:30px;height:30px;font-size:12px}
.av.l{width:56px;height:56px;font-size:20px}
.av.sq{border-radius:16px}
.av.doc{background:#2c2c2c;color:var(--y)}
.avs.s{gap:0}.avs.s .av{margin-left:-8px;border:2px solid var(--k2)}.avs.s .av:first-child{margin-left:0}
.link{color:var(--y);font-weight:700;margin-top:10px;min-height:40px}
.feed>div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:9px 0;font-size:14px;border-top:1px solid #2b2b2b}
.feed>div:first-child{border-top:0}
.feed i{width:8px;height:8px;border-radius:50%;background:var(--y);align-self:center}
.feed small{color:var(--g);font-size:12px;white-space:nowrap}
.seg{display:flex;gap:4px;background:var(--k2);border-radius:16px;padding:4px;margin-bottom:12px}
.seg button{flex:1;min-height:44px;border-radius:12px;font-weight:700;font-size:14px;color:var(--g)}
.seg .on{background:var(--y);color:var(--k)}
.srch{display:flex;align-items:center;gap:10px;background:var(--k2);border:1px solid #2b2b2b;border-radius:16px;padding:0 14px;min-height:50px;margin-bottom:12px;color:var(--g)}
.srch:focus-within{border-color:var(--y)}
.srch input{flex:1;border:0;background:none;outline:0;font-size:16px;height:48px;color:var(--w)}
.fchips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 2px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchips .chip{flex:none;min-height:40px;padding:8px 14px;font-size:14px}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:20px;background:var(--k2);border:1px solid #262626;margin-bottom:8px;transition:transform .15s,border-color .15s}
.li:hover{border-color:#3d3d3d}.li:active{transform:scale(.985)}
.li.flat{background:none;border:0;border-top:1px solid #2b2b2b;border-radius:0;padding:12px 0;margin:0}
.card2 h3+.li.flat{border-top:0}
.li .m{flex:1;min-width:0}
.li .m b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- effects ---------- */
function tilt(el){if(!el)return;const set=(x,y)=>{el.style.transform=`rotateY(${x*18}deg) rotateX(${-y*18}deg)`;el.style.setProperty('--sh',(x*60)+'%')};
 const mv=e=>{const r=el.getBoundingClientRect(),p=e.touches?e.touches[0]:e;set((p.clientX-r.left)/r.width-.5,(p.clientY-r.top)/r.height-.5)};
 el.addEventListener('pointermove',mv);el.addEventListener('touchmove',mv,{passive:true});el.addEventListener('pointerleave',()=>set(0,0));
 try{window.addEventListener('deviceorientation',e=>{if(e.gamma==null)return;set(Math.max(-.5,Math.min(.5,e.gamma/60)),Math.max(-.5,Math.min(.5,(e.beta-45)/60)))})}catch(e){}}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<26;i++){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 339 350');s.setAttribute('class','cf');s.innerHTML='<use href="#st"/>';
 s.style.left=Math.random()*100+'vw';s.style.setProperty('--x',(Math.random()*120-60)+'px');s.style.setProperty('--r',(Math.random()*720-360)+'deg');s.style.setProperty('--t',(1.4+Math.random()*1.4)+'s');s.style.width=(12+Math.random()*20)+'px';
 if(role==='brand'&&i%2)s.style.fill='#121212';document.body.appendChild(s);setTimeout(()=>s.remove(),3200)}}

function ctrRow(c){return `<button class="li" data-t="open" data-v="ctr:${c.id}"><span class="av sq doc">${ic('doc',22)}</span><span class="m"><b>${esc(c.type==='mgmt'?'@'+c.creator:c.brand)}</b><small>${c.type==='mgmt'?`Management · ${c.com}%`:`Colaborare · ${mdl(+c.sum||0)}`} · ${esc(c.id)}</small></span><span class="r">${bd(CTRST[c.st])}<small>${c.st==='semnat'?'semnat '+ago(c.signed):ago(c.t)}</small></span></button>`}
function vCtr(){const L=T.ctr.filter(c=>tf==='toate'||c.st===tf).sort((a,b)=>ORD2(a)-ORD2(b)||b.t-a.t);
 return `<div class="vrow"><h1 class="vt d">Contracte</h1><button class="add" data-t="newctr">+ Contract nou</button></div>
 ${filt([['toate','Toate'],['draft','Ciorne'],['trimis','La semnat'],['semnat','Semnate']],T.ctr)}<div class="lgrid">${L.map(ctrRow).join('')||empty('Niciun contract aici.')}</div>
 <p class="note">Modele orientative generate de prototip. Înainte de folosire reală, le verifică un jurist.</p>`}

function payRow(p){return `<button class="li flat" data-t="open" data-v="pay:${p.id}"><span class="av sq doc">${ic('coin',22)}</span><span class="m"><b>${esc(p.brand)}</b><small>${esc(p.id)}${p.note?' · '+esc(p.note):''} · ${p.st==='platit'?'plătit '+ago(p.paid):'scadent '+due(p.due)}</small></span><span class="r"><b class="mo">${mdl(p.sum)}</b>${bd(PAYST[p.st])}</span></button>`}
function vBani(){const t=now(),dt=new Date(),m=dt.getMonth(),k=kpis();
 const wait=T.pay.filter(p=>p.st==='asteapta').reduce((s,p)=>s+p.sum,0),late=T.pay.filter(p=>p.st==='intarziat').reduce((s,p)=>s+p.sum,0);
 const curM=T.pay.filter(p=>p.st==='platit'&&new Date(p.paid).getMonth()===m&&new Date(p.paid).getFullYear()===dt.getFullYear()).reduce((s,p)=>s+p.sum,0);
 const vals=[...T.hist.slice(-5),curM],mx=Math.max(...vals,1);
 return `<h1 class="vt d">Bani</h1>
 <div class="kpis">${kpi(k.paid,'Încasat, 30 de zile','y','',1)}${kpi(k.rev,`Partea ARSENI (${T.com}%)`,'','',1)}${kpi(wait,'De încasat','','',1)}${kpi(late,'Întârziat',late?'red':'','',1)}</div>
 <div class="g2"><section class="card2"><h3>Încasări pe luni</h3><div class="bars">${vals.map((v,i)=>`<div><b>${fmtM(v)}</b><i style="height:${Math.max(3,v/mx*100)}%;animation-delay:${i*70}ms"></i><small>${LUNI[(m-5+i+12)%12]}</small></div>`).join('')}</div></section>
 <section class="card2"><h3>Din fiecare leu</h3><div class="split"><i style="width:${100-T.com}%;background:var(--y)"></i><i style="width:${T.com}%;background:var(--w)"></i></div><div class="leg"><span><i style="background:var(--y)"></i>${100-T.com}% creatorilor</span><span><i style="background:var(--w)"></i>${T.com}% casei ARSENI</span></div><p class="note">Creatorii primesc banii în 10 zile lucrătoare de la încasare. Comisionul se schimbă din Setări.</p></section></div>
 <section class="card2"><h3>Facturi ${bd([String(T.pay.filter(p=>p.st!=='platit').length)+' deschise','g'])}</h3>${T.pay.slice().sort((a,b)=>(a.st==='platit')-(b.st==='platit')||a.due-b.due).map(payRow).join('')}</section>`}

function vSet(){return `<h1 class="vt d">Setări</h1>
 <section class="card2"><h3>Comisionul casei</h3><div class="big d" id="cv" style="font-size:52px;margin:0;text-align:left">${T.com}%</div><input type="range" min="10" max="30" value="${T.com}" data-tr="com" style="--p:${(T.com-10)/20*100}%" aria-label="Comision"><div class="ticks"><span>10%</span><span>30%</span></div><p class="note">Se aplică contractelor noi. Cele semnate rămân cum sunt.</p></section>
 <section class="card2"><h3>Cine ești în echipă</h3><div class="opts">${MEM.map((m,i)=>`<button class="opt ${T.me===i?'on':''}" data-t="me" data-v="${i}"><span class="ic">${m[0]}</span><span><b>${m[1]}</b><small>${m[2]}</small></span><span class="tk">✓</span></button>`).join('')}</div></section>
 <section class="card2"><h3>Date</h3><div style="display:grid;gap:8px"><button class="ghost" style="margin:0" data-t="export">Copiază toate datele (JSON)</button><button class="ghost" style="margin:0" data-t="reset">Resetează datele demo</button><button class="ghost" style="margin:0" data-t="exit">Ieși din panou</button></div><p class="note">Prototip: datele stau doar în acest browser. Versiunea reală le ține pe server, cu acces securizat pentru echipă.</p></section>`}
function vMore(){return `<h1 class="vt d">Mai mult</h1><div class="opts">${[['camp','grid','Campanii','Etape, termene, #reclamă'],['bani','coin','Bani','Facturi, încasări, comision'],['set','sliders','Setări','Comision, echipă, date']].map(([k,i,t,s])=>`<button class="opt" data-t="nav" data-v="${k}"><span class="ic">${ic(i,22)}</span><span><b>${t}</b><small>${s}</small></span><span class="tk" style="color:var(--g);border:0">→</span></button>`).join('')}</div><button class="ghost" data-t="exit" style="margin-top:16px">Ieși din panou</button>`}
const VIEW={azi:vAzi,cre:vCre,br:vBr,camp:vCamp,ctr:vCtr,bani:vBani,set:vSet,more:vMore};

/* shell */
function tenter(dir){tload();role='team';closeSheet();if(T.me==null){gate(dir);return}team(dir)}
function gate(dir){go(`<div class="bar"><button class="bk" data-home aria-label="Acasă">←</button><div class="grow"></div><span class="pill" style="background:var(--y);color:var(--k)">Doar pentru echipă</span></div>
 <div class="hero" style="min-height:190px">${star('star')}</div>
 <h2 class="q d">Panoul casei.</h2><p class="hint">Aici ARSENI alege creatorii, răspunde brandurilor și semnează contractele. Cine intră azi?</p>
 <div class="opts">${MEM.map((m,i)=>`<button class="opt" data-t="me" data-v="${i}"><span class="ic">${m[0]}</span><span><b>${m[1]}</b><small>${m[2]}</small></span><span class="tk" style="color:var(--g);border:0">→</span></button>`).join('')}</div>
 <p class="note">Prototip fără parolă. Versiunea reală va avea acces securizat pentru echipă.</p>`,'tgate',dir)}
function team(dir){go(`<aside class="side"><div class="sl"><svg class="wm" viewBox="0 0 770 126" role="img" aria-label="ARSENI"><use href="#wm"/></svg><span>Panoul casei</span></div><nav id="sn" style="display:grid;gap:4px"></nav><div id="sm" style="margin-top:auto"></div></aside>
 <header class="ttop"><span class="tt">${star('','width:24px;fill:var(--y)')}<b class="d">Echipa</b></span><button class="tbell" data-t="nav" data-v="azi" aria-label="De făcut">${ic('bell')}<i id="bellN"></i></button><button class="tme" id="tme" data-t="nav" data-v="set" aria-label="Setări"></button></header>
 <main class="tmain" id="tmain"></main><nav class="tbar" id="tbar"></nav>`,'team',dir);
 try{history.replaceState(null,'',location.pathname+'#echipa')}catch(e){}trender()}
function trender(keep){const mm=$('#tmain');if(!mm)return;const m=MEM[T.me]||MEM[0];
 $('#sn').innerHTML=NAV.map(([k,l,i])=>`<button class="tn ${tv===k?'on':''}" data-t="nav" data-v="${k}">${ic(i)}<span>${l}</span>${nb(k)}</button>`).join('');
 const mv=['camp','bani','set','more'].includes(tv)?'more':tv;
 $('#tbar').innerHTML=NAVM.map(k=>{const n=NAV.find(x=>x[0]===k)||['more','Mai mult','more'];return `<button class="tn ${mv===k?'on':''}" data-t="nav" data-v="${k}">${ic(n[2],22)}<span>${n[1]}</span>${nb(k)}</button>`}).join('');
 $('#sm').innerHTML=`<button class="me2" data-t="nav" data-v="set"><span class="av s">${m[0]}</span><span><b>${esc(m[1])}</b><small>${esc(m[2])}</small></span></button>`;
 $('#tme').textContent=m[0];const n=todos().length,b=$('#bellN');b.textContent=n;b.style.display=n?'':'none';
 mm.innerHTML=VIEW[tv]();mm.classList.remove('fx');if(!keep){void mm.offsetWidth;mm.classList.add('fx');mm.closest('.scr').scrollTop=0}
 countUp(mm,keep)}
function countUp(root,instant){root.querySelectorAll('[data-count]').forEach(el=>{const v=+el.dataset.count,mo=el.hasAttribute('data-money'),f=x=>mo?fmtM(x):String(x);
 if(instant||matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=f(v);return}
 const t0=performance.now();const st=t=>{const p=Math.min(1,(t-t0)/900),e=1-Math.pow(1-p,3);el.textContent=f(Math.round(v*e));if(p<1)requestAnimationFrame(st)};requestAnimationFrame(st)})}

/* sheets */
function sheet(html,stay){const s=$('#sheet'),old=s.querySelector('.sp'),key=cur?cur.join(':'):'',y=stay&&old&&key===s.dataset.k?old.scrollTop:0;s.dataset.k=key;
 s.className='sheet on'+(stay?' stay':'');document.body.classList.add('sh');s.innerHTML=`<div class="sb" data-t="close"></div><div class="sp" role="dialog" aria-modal="true" aria-label="Detalii">${html}</div>`;
 const n=s.querySelector('.sp');n.scrollTop=y;if(!stay)setTimeout(()=>{const x=n.querySelector('.x');x&&x.focus({preventScroll:true})},60)}
function closeSheet(){const s=$('#sheet');if(!s||!s.classList.contains('on'))return;s.classList.remove('on');s.classList.add('closing');document.body.classList.remove('sh');cur=null;rej=false;
 setTimeout(()=>{if(!s.classList.contains('on')){s.className='sheet';s.innerHTML=''}},260)}
const shd=(avatar,title,sub,badges)=>`<div class="grab"></div><div class="shd">${avatar}<div class="sht"><h2 class="d">${title}</h2><small>${sub}</small></div><button class="x" data-t="close" aria-label="Închide">${ic('x',18)}</button></div>${badges?`<div class="shb">${badges}</div>`:''}`;
function topen(k,id,stay){cur=[k,id];({app:sApp,ros:sRos,req:sReq,ctr:sCtr,camp:sCamp,pay:sPay,new:sNew})[k](id,stay)}

function msgFor(a){const n=(a.name||a.h).split(' ')[0];
 return a.st==='acc'?`Salut, ${n}! Echipa ARSENI ți-a verificat profilul și te vrem în casă. ✱ Urmează o întâlnire 1:1 și 3 luni de probă. Când ai timp săptămâna asta?`
 :a.st==='resp'?`Salut, ${n}! Mulțumim că ai aplicat la ARSENI. Acum nu te putem lua în casă: ${a.reason||''}. Ușa rămâne deschisă: poți aplica din nou peste 3 luni, iar ARSENI Academy e gratuit pentru tine.`
 :`Salut, ${n}! Ne place ce faci. Ca să terminăm verificarea, trimite-ne statisticile din ultimele 30 de zile (reach, vârsta publicului, orașe). Echipa ARSENI ✱`}
function sApp(id,stay){const a=T.apps.find(x=>x.id===id);if(!a)return closeSheet();const sc=score(a),A=AUD[a.niche[0]]||AUD['Lifestyle'],op=['nou','verif','info'].includes(a.st);
 const ver=sc>=75?['Recomandat pentru casă','ok']:sc>=50?['De discutat la 1:1','w']:['Risc pentru casă','no'];
 sheet(shd(av(a.h,null,'l'),'@'+esc(a.h),`${esc(a.name)} · ${esc(a.id)} · a aplicat ${ago(a.t)}`,bd(APPST[a.st])+(a.src==='app'?bd(['din aplicație','y']):''))+
 `${a.st==='acc'?`<div class="okban">${star('','width:20px;fill:var(--k);flex:none')}<span>În casă de ${ago(a.dec||a.t)}. Contractul ${esc(a.ctr||'')} e pregătit, urmează întâlnirea 1:1.</span></div>`:''}<div class="facts"><div><b>${fmt(a.f)}</b><small>urmăritori</small></div><div><b>${String(a.er).replace('.',',')}%</b><small>implicare medie</small></div><div><b>${esc(tierOf(a.f)[0])}</b><small>nivel</small></div><div><b>${a.plat.length}</b><small>${esc(a.plat.join(', '))}</small></div></div>
 ${a.flags&&a.flags.length?`<div class="flag"><b>⚑ Semnale găsite la verificare</b>${a.flags.map(f=>`<div>· ${esc(f)}</div>`).join('')}</div>`:''}
 <div class="lbl">Pentru cine creează</div><div class="pub"><b>${esc(A[0])}</b><span>${esc(A[1])}</span><div class="chips sm">${a.niche.map(n=>`<span class="chip on">${esc(n)}</span>`).join('')}</div></div>
 <div class="lbl">Are nevoie de</div><div class="chips sm">${a.need.map(n=>{const x=NEED.find(y=>y[0]===n);return `<span class="chip">${esc(x?x[1]:n)}</span>`}).join('')}</div>
 <div class="lbl">Codul de etică semnat</div><div class="pledge">${ETH.map(e=>`<div class="${a.eth.includes(e[0])?'ok':''}">${a.eth.includes(e[0])?'✓':'✕'} ${esc(e[1])}</div>`).join('')}</div>
 <div class="lbl">Verificarea casei</div><div class="scorebox"><div class="gauge" style="--v:${sc}"><div><b class="d">${sc}</b><small>scor ARSENI</small></div></div><div>${bd(ver)}<p class="note">Bifează ce a verificat echipa: conținut, reclame, etică și public.</p></div></div>
 <div class="opts">${CHK.map(([k,i,t,s])=>`<button class="opt ${a.chk&&a.chk[k]?'on':''}" data-t="chk" data-v="${k}" ${op?'':'disabled'}><span class="ic">${i}</span><span><b>${t}</b><small>${s}</small></span><span class="tk">✓</span></button>`).join('')}</div>
 <div class="lbl">Notă internă</div><textarea class="tnote" data-ti="note" placeholder="Ce a observat echipa…">${esc(a.note||'')}</textarea>
 ${a.st==='resp'?`<div class="flag soft"><b>Motiv: ${esc(a.reasonL||'')}</b>${esc(cap(a.reason||''))}.</div>`:''}
 <div class="sact">${op?(rej?`<div class="lbl" style="margin:0">De ce nu acum?</div><div class="opts">${REASON.map((r,i)=>`<button class="opt" data-t="rejr" data-v="${i}"><span class="ic">${i+1}</span><span><b>${esc(r[0])}</b><small>${esc(cap(r[1]))}.</small></span><span class="tk" style="color:var(--g);border:0">→</span></button>`).join('')}</div><button class="ghost" data-t="rejx">Anulează</button>`
  :`<button class="go" data-t="accept">${star('','width:20px;fill:var(--k)')} Acceptă în casă</button><div class="two"><button class="ghost" data-t="info">Cere detalii</button><button class="ghost no" data-t="rej">Respinge</button></div>`)
  :`<button class="go" data-t="msg">Copiază mesajul pentru ${esc((a.name||a.h).split(' ')[0])}</button>${a.st==='acc'&&a.ctr?`<button class="ghost" data-t="gotoctr" data-v="${esc(a.ctr)}">Deschide contractul de management</button>`:''}`}</div>`,stay)}

function sRos(h,stay){const r=rost(h);if(!r)return closeSheet();const days=Math.floor((now()-r.since)/DY)+1,trial=days<=90,A=AUD[r.n]||AUD['Lifestyle'];
 const cs=T.camp.filter(c=>c.creators.includes(h)),ct=T.ctr.filter(c=>c.creator===h||(c.creators||[]).includes(h));
 sheet(shd(av(r.h,r.c,'l'),'@'+esc(r.h),`${esc(r.n)} · ${trial?`probă, ziua ${days} din 90`:'în casă din '+dstr(r.since)}`,bd(busy(h)?['În campanie','w']:['Liber pentru campanii','ok']))+
 `<div class="facts"><div><b>${fmt(r.f)}</b><small>urmăritori</small></div><div><b>${r.camp+cs.filter(c=>c.stage<5).length}</b><small>campanii cu ARSENI</small></div><div><b>${fmtM(r.earned)}</b><small>MDL câștigați prin casă</small></div><div><b>${trial?Math.max(0,90-days)+' zile':'12 luni'}</b><small>${trial?'până la finalul probei':'contract curent'}</small></div></div>
 <div class="lbl">Publicul lui</div><div class="pub"><b>${esc(A[0])}</b><span>${esc(A[1])}</span></div>
 <div class="lbl">Campanii</div>${cs.length?`<div class="match">${cs.map(c=>`<button class="cr dk" data-t="open" data-v="camp:${c.id}"><span class="av sq" style="background:${PAL[hash(c.brand)%6]}">${esc(c.brand[0])}</span><span><b>${esc(c.brand)}</b><small>${STG[c.stage]}</small></span><span class="pc">${Math.ceil(c.deliv/c.creators.length)} reels</span></button>`).join('')}</div>`:empty('Nicio campanie încă.')}
 <div class="lbl">Contracte</div>${ct.length?`<div class="match">${ct.map(c=>`<button class="cr dk" data-t="open" data-v="ctr:${c.id}"><span class="av sq doc">${ic('doc',20)}</span><span><b>${esc(c.title)}</b><small>${esc(c.id)}</small></span><span class="pc">${bd(CTRST[c.st])}</span></button>`).join('')}</div>`:empty('Niciun contract încă.')}
 <div class="sact">${ct.some(c=>c.type==='mgmt')?`<button class="ghost" data-t="close">Gata</button>`:`<button class="go" data-t="mkmgmt" data-v="${esc(h)}">Generează contractul de management</button>`}</div>`,stay)}

function sReq(id,stay){const r=T.req.find(x=>x.id===id);if(!r)return closeSheet();const g=GOAL.find(x=>x[0]===r.goal)||GOAL[0],e=estim(r.budget),M=matchR(r),op=['nou','disc','oferta'].includes(r.st);
 if(!r.pick)r.pick=M.slice(0,Math.min(3,e.n)).map(x=>x.h);
 const why={L:'să se afle de lansare exact la publicul care contează',C:'să vină clienți noi, măsurați prin cod promo',I:'să crească încrederea tinerilor în brand',E:'să găsească oamenii potriviți pentru echipă'}[r.goal];
 const cr=Math.round(r.budget*(100-T.com)/100);
 sheet(shd(`<span class="av l sq" style="background:${PAL[hash(r.name)%6]}">${esc(r.name[0].toUpperCase())}</span>`,esc(r.name),`${esc(r.person)} · ${esc(r.contact)} · ${ago(r.t)}`,bd(REQST[r.st])+(r.src==='app'?bd(['din aplicație','y']):''))+
 `<div class="bigm d">${mdl(r.budget)}<small>buget campanie · ${esc(r.dom.join(', '))}</small></div>
 <div class="brief dark"><div class="row"><b>CE</b><span>${esc(g[1])}: ${e.r} reels cu ${e.n} creatori, ~${fmt(e.v)} vizualizări.</span></div><div class="row"><b>CINE</b><span>Public ${esc(r.age.join(', '))}: ${esc(r.aud.join(', ').toLowerCase())}.</span></div><div class="row"><b>DE CE</b><span>Pentru ca brandul ${esc(why)}.</span></div><div class="row"><b>AIDA</b><span>Hook în 2 secunde · povestea creatorului · produsul de aproape · cod promo.</span></div></div>
 <div class="lbl">Creatori din casă potriviți${op?' · atinge ca să alegi':''}</div><div class="match">${M.slice(0,5).map(x=>`<button class="cr dk ${r.pick.includes(x.h)?'on':''}" data-t="pick" data-v="${esc(x.h)}" ${op?'':'disabled'}>${av(x.h,x.c)}<span><b>@${esc(x.h)}</b><small>${esc(x.n)} · ${fmt(x.f)}${busy(x.h)?' · în campanie':''}</small></span><span class="pc">${x.s}%</span></button>`).join('')}</div>
 <div class="lbl">Cum se împarte bugetul</div><div class="split"><i style="width:${100-T.com}%;background:var(--y)"></i><i style="width:${T.com}%;background:var(--w)"></i></div><div class="leg"><span><i style="background:var(--y)"></i>Creatori: ${mdl(cr)}</span><span><i style="background:var(--w)"></i>ARSENI ${T.com}%: ${mdl(r.budget-cr)}</span></div>
 <div class="sact">${op?`<button class="go" data-t="racc" ${r.pick.length?'':'disabled'}>${star('','width:20px;fill:var(--k)')} Acceptă și fă contractul</button><div class="two"><button class="ghost" data-t="offer">${r.st==='oferta'?'Retrimite oferta':'Trimite oferta'}</button><button class="ghost no" data-t="rref">Refuză</button></div>`

 case 'ncwho':nc.who=v;sNew('',true);break;
 case 'nccreate':{let c;if(nc.type==='mgmt')c=createMgmt(nc.who,cap(nc.who.split(/[._]/)[0]));else{const r=T.req.find(x=>x.name===nc.who);if(!r)break;c=createColab(r)}
  addLog(`Ciornă nouă: ${c.title}`);tsave();trender(true);topen('ctr',c.id,true);toast('Ciorna e gata ✱');break}
 case 'export':copyTxt(JSON.stringify(T,null,1),'Datele sunt copiate');break;
 case 'reset':{if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Sigur? Atinge din nou';b.classList.add('no');break}const me=T.me;T=seed();T.me=me;tsave();tv='set';trender(true);toast('Datele demo sunt resetate');break}
 }});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.ti){const k=t.dataset.ti,v=t.value;
  if(k==='q'){tq=v;const L=$('#tl');if(L)L.innerHTML=tv==='br'?listBr():listCre();return}
  if(k==='note'&&cur){const a=T.apps.find(x=>x.id===cur[1]);if(a){a.note=v;tsave()}return}
  if(k==='by'&&cur){const c=T.ctr.find(x=>x.id===cur[1]);if(c){c.byDraft=v;tsave()}return}
  if(k.startsWith('c.')&&cur){const c=T.ctr.find(x=>x.id===cur[1]);if(!c)return;const f=k.slice(2);
   if(f==='start'||f==='end'){if(v)c[f]=new Date(v+'T12:00:00').getTime()}else c[f]=Math.max(0,Math.min(f==='com'?50:1e9,+v||0));
   tsave();const p=$('#paper');if(p)p.innerHTML=ctrDoc(c);return}}
 if(t.dataset.tr==='com'){T.com=+t.value;t.style.setProperty('--p',(T.com-10)/20*100+'%');$('#cv').textContent=T.com+'%';tsave()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
window.addEventListener('afterprint',()=>document.body.classList.remove('printing'));

/* ---------- events ---------- */
app.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;buzz();
 if(t.dataset.go){role=t.dataset.go;step=0;flow(1);return}
 if(t.hasAttribute('data-home')){home(-1);return}
 if(t.hasAttribute('data-back')){if(step===0)home(-1);else{step--;flow(-1)}return}
 if(t.hasAttribute('data-next')){if(t.disabled)return;store();const F=role==='creator'?C:B;if(step<F.total-1){step++;flow(1)}else role==='creator'?resultCreator():resultBrand();return}
 if(t.dataset.copy){copy(t.dataset.copy);return}
 const k=t.dataset.k;if(!k)return;const v=t.dataset.v;
 const map={plat:S.c.plat,niche:S.c.niche,need:S.c.need,eth:S.c.eth,dom:S.b.dom,age:S.b.age,aud:S.b.aud,beth:S.b.eth};
 if(k==='goal'){S.b.goal=v;t.parentNode.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o===t))}
 else{const arr=map[k],max=+t.dataset.max,i=arr.indexOf(v);
  if(i>=0)arr.splice(i,1);else{if(max&&arr.length>=max){const first=arr.shift();const fb=t.parentNode.querySelector(`[data-v="${CSS.escape(first)}"]`);fb&&fb.classList.remove('on')}arr.push(v)}
  t.classList.toggle('on',arr.includes(v));t.setAttribute('aria-pressed',arr.includes(v))}
 refreshOk()});
app.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.in){const m={handle:v=>S.c.handle=v.replace(/\s/g,''),name:v=>S.c.name=v,contact:v=>S.c.contact=v,bname:v=>S.b.name=v,person:v=>S.b.person=v,bcontact:v=>S.b.contact=v};m[t.dataset.in](t.value);refreshOk();return}
 if(t.dataset.range){const v=+t.value;t.style.setProperty('--p',v+'%');
  if(t.dataset.range==='f'){S.c.f=v;const f=followers(v),tr=tierOf(f);$('#fv').innerHTML=esc(fmt(f))+'<small>urmăritori</small>';$('#tv').innerHTML='<b>'+esc(tr[0])+'</b><br>'+esc(tr[1])}
  else{S.b.budget=v;const b=budget(v);$('#bv').innerHTML=esc(mdl(b))+'<small>buget campanie</small>';$('#ev').innerHTML=estHTML(estim(b))}
  if(v%10===0)buzz()}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){const b=app.querySelector('.scr:not(.out) [data-next]');if(b&&!b.disabled)b.click()}});
const start=location.hash.replace('#','');if(start==='creator'||start==='brand'){role=start;flow(1)}else if(start==='echipa')tenter(1);else home(1);
}
