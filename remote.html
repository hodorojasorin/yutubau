<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <meta name="theme-color" content="#0d0d0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="robots" content="noindex" />
    <title>Telecomandă · sorinarseni</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap"
    />
    <link rel="stylesheet" href="css/remote-phone.css" />
  </head>
  <body>
    <header class="top">
      <span class="st" id="st"><i></i><b>Se conectează…</b></span>
      <button type="button" class="aa" id="aa" title="Mărimea textului din notițe" hidden>Aa</button>
      <button
        type="button"
        class="time"
        id="time"
        title="Atinge ca să pornești timpul de la zero"
      >
        00:00
      </button>
    </header>

    <main class="card" id="card">
      <p class="count"><b id="cnt">–</b> <span id="tot"></span></p>
      <h1 id="name">Telecomanda</h1>
      <p class="q" id="q" hidden><i>?</i><span></span></p>
      <div class="notes" id="notes" hidden></div>
      <p class="next" id="next"></p>
      <p class="hint" id="hint">
        Dă swipe stânga pentru slide-ul următor, dreapta pentru cel anterior.
      </p>
    </main>

    <nav class="pad" aria-label="Slide-uri">
      <button type="button" id="prev" aria-label="Slide-ul anterior">←</button>
      <button type="button" id="nextb" aria-label="Slide-ul următor">→</button>
    </nav>

    <div class="noid" id="noid" hidden>
      <h1>Telecomanda</h1>
      <p>
        Deschide o prezentare pe laptop, apasă <b>📱 Telecomandă</b> (colțul din
        dreapta jos sau tasta T) și scanează codul QR cu telefonul.
      </p>
      <a href="index.html">← Proiectele</a>
    </div>

    <script src="js/bus.js"></script>
    <script src="js/remote.js"></script>
  </body>
</html>
